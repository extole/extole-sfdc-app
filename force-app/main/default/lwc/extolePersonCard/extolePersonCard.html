<template>
    <template lwc:if={disabled}></template>
    <template lwc:else>
        <template lwc:if={isLoading}>
            <div class="loading-row">
                <lightning-spinner
                    size="small"
                    alternative-text="Loading"
                ></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={shouldRender}>
            <div class="person-card">
                <div class="card-header">
                    <c-extole-logo-mark></c-extole-logo-mark>
                    <div class="header-title">Extole Referrals</div>
                    <div class="header-aside">
                        <template lwc:if={profileUrl}>
                            <a
                                class="header-link"
                                href={profileUrl}
                                target="_blank"
                                rel="noopener noreferrer"
                                title={viewLinkTitle}
                            >
                                <span class="header-link-text"
                                    >View profile in Extole</span
                                >
                                <lightning-icon
                                    icon-name="utility:new_window"
                                    size="xx-small"
                                    alternative-text="Opens in a new tab"
                                    class="header-link-icon"
                                ></lightning-icon>
                            </a>
                        </template>
                    </div>
                </div>

                <template lwc:if={hasReferralBlocks}>
                    <div class="section" style={referredByOrder}>
                        <div
                            class="section-header"
                            data-section="referredBy"
                            onclick={toggleSection}
                        >
                            <lightning-icon
                                icon-name={referredByChevron}
                                size="xx-small"
                                class="section-chevron"
                            ></lightning-icon>
                            <span class="section-label">{referredByLabel}</span>
                            <lightning-helptext
                                content={referredByHelpText}
                                class="section-help"
                                onclick={stopClick}
                            ></lightning-helptext>
                            <template lwc:if={hasReferralBlocks}>
                                <button
                                    type="button"
                                    class="expand-btn"
                                    onclick={handleExpandReferrers}
                                    title="Expand referrers"
                                    aria-label="Expand referrers"
                                >
                                    <lightning-icon
                                        icon-name="utility:expand_alt"
                                        size="xx-small"
                                        class="expand-icon"
                                    ></lightning-icon>
                                </button>
                            </template>
                        </div>
                        <template lwc:if={referredByExpanded}>
                            <div class="section-body offers-body">
                                <template
                                    for:each={visibleReferralGroups}
                                    for:item="group"
                                >
                                    <div key={group.key} class="program-group">
                                        <template lwc:if={group.program}>
                                            <span
                                                class="program-pill"
                                                style={group.programStyle}
                                                >{group.program}</span
                                            >
                                        </template>
                                        <template
                                            for:each={group.cards}
                                            for:item="card"
                                        >
                                            <div
                                                key={card.key}
                                                class="referral-card"
                                            >
                                                <div class="referrer-row">
                                                    <span class="referrer-by">
                                                        <span
                                                            class="referrer-in"
                                                            >referral from</span
                                                        >
                                                        <template
                                                            lwc:if={card.line.isLinked}
                                                        >
                                                            <a
                                                                href={card.line.sfdcUrl}
                                                                class="record-link referrer-name"
                                                                title={card.line.title}
                                                                >{card.line.displayName}</a
                                                            >
                                                        </template>
                                                        <template lwc:else>
                                                            <span
                                                                class="plain-email referrer-name"
                                                                title={card.line.title}
                                                                >{card.line.displayName}</span
                                                            >
                                                        </template>
                                                    </span>
                                                    <template
                                                        lwc:if={card.line.reward}
                                                    >
                                                        <span
                                                            class={card.line.reward.cls}
                                                            >{card.line.reward.text}<template
                                                                lwc:if={card.line.reward.dateText}
                                                                ><span
                                                                    class="pill-date"
                                                                    >{card.line.reward.dateText}</span
                                                                ></template
                                                            ></span
                                                        >
                                                    </template>
                                                </div>
                                                <template
                                                    lwc:if={card.hasMilestones}
                                                >
                                                    <c-extole-milestones
                                                        milestones={card.milestones}
                                                    ></c-extole-milestones>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template lwc:if={referrersExpandable}>
                                    <div class="show-more-row">
                                        <span class="show-more-count"
                                            >{referrersCountText}</span
                                        >
                                        <template
                                            lwc:if={referrersShowMoreVisible}
                                        >
                                            <button
                                                type="button"
                                                class="show-more-btn"
                                                onclick={handleShowMoreReferrers}
                                            >
                                                Show more
                                            </button>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <template lwc:if={hasShareLinks}>
                    <div class="section" style={shareLinksOrder}>
                        <div
                            class="section-header"
                            data-section="shareLinks"
                            onclick={toggleSection}
                        >
                            <lightning-icon
                                icon-name={shareLinksChevron}
                                size="xx-small"
                                class="section-chevron"
                            ></lightning-icon>
                            <span class="section-label">{shareLinksLabel}</span>
                        </div>
                        <template lwc:if={shareLinksExpanded}>
                            <div class="section-body">
                                <template
                                    for:each={decoratedShareLinks}
                                    for:item="sl"
                                >
                                    <div key={sl.code} class="share-link-row">
                                        <template lwc:if={sl.program}>
                                            <span
                                                class="program-pill"
                                                style={sl.programStyle}
                                                >{sl.program}</span
                                            >
                                        </template>
                                        <template lwc:else>
                                            <span></span>
                                        </template>
                                        <span class="share-link-url">
                                            {sl.link}
                                            <template
                                                lwc:if={sl.isSavedOnRecord}
                                            >
                                                <span
                                                    class="saved-marker"
                                                    title="This link is saved on the record"
                                                    >saved on record</span
                                                >
                                            </template>
                                        </span>
                                        <button
                                            class="copy-btn"
                                            data-link={sl.link}
                                            onclick={handleCopyLink}
                                            title="Copy link"
                                        >
                                            <lightning-icon
                                                icon-name="utility:copy"
                                                size="x-small"
                                            ></lightning-icon>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <template lwc:if={hasFriends}>
                    <div class="section" style={friendsOrder}>
                        <div
                            class="section-header"
                            data-section="friends"
                            onclick={toggleSection}
                        >
                            <lightning-icon
                                icon-name={friendsChevron}
                                size="xx-small"
                                class="section-chevron"
                            ></lightning-icon>
                            <span class="section-label">{friendsLabel}</span>
                            <lightning-helptext
                                content={helpText}
                                class="section-help"
                                onclick={stopClick}
                            ></lightning-helptext>
                            <button
                                type="button"
                                class="expand-btn"
                                onclick={handleExpand}
                                title="Expand friends"
                                aria-label="Expand friends"
                            >
                                <lightning-icon
                                    icon-name="utility:expand_alt"
                                    size="xx-small"
                                    class="expand-icon"
                                ></lightning-icon>
                            </button>
                        </div>
                        <template lwc:if={friendsExpanded}>
                            <div class="section-body friends-body">
                                <template for:each={programGroups} for:item="g">
                                    <div key={g.program} class="program-group">
                                        <span
                                            class="program-pill"
                                            style={g.programStyle}
                                            >{g.program}</span
                                        >
                                        <template
                                            for:each={g.friends}
                                            for:item="f"
                                        >
                                            <c-extole-friend-card
                                                key={f.key}
                                                friend={f}
                                            ></c-extole-friend-card>
                                        </template>
                                    </div>
                                </template>
                                <template lwc:if={showCountRow}>
                                    <div class="show-more-row">
                                        <span class="show-more-count"
                                            >{friendsCountText}</span
                                        >
                                        <template lwc:if={showMoreVisible}>
                                            <button
                                                type="button"
                                                class="show-more-btn"
                                                onclick={handleShowMore}
                                                disabled={isLoadingMore}
                                            >
                                                {showMoreLabel}
                                            </button>
                                        </template>
                                        <template lwc:if={loadMoreError}>
                                            <div class="error-banner">
                                                {loadMoreError}
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </template>

        <template lwc:if={loadError}>
            <div class="error-banner">{loadError}</div>
        </template>
    </template>
</template>
