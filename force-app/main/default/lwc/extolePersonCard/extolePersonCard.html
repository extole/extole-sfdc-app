<template>
    <template lwc:if={disabled}></template>
    <template lwc:else>
        <template lwc:if={isLoading}>
            <div class="loading-row">
                <lightning-spinner
                    size="small"
                    alternative-text="Loading"
                ></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={shouldShowEmpty}>
            <div class="person-card empty-card">
                <div class="empty-state">
                    <lightning-icon
                        icon-name="utility:user"
                        size="small"
                        class="empty-icon"
                    ></lightning-icon>
                    <div class="empty-text">
                        No Extole activity for this person yet.
                    </div>
                </div>
            </div>
        </template>

        <template lwc:elseif={shouldRender}>
            <div class="person-card">
                <div class="card-header">
                    <div class="avatar avatar-lg">
                        <span class="avatar-initials">{initials}</span>
                    </div>
                    <div class="header-text">
                        <div class="header-name">{displayName}</div>
                        <template lwc:if={roleLabel}>
                            <div class="header-role">{roleLabel}</div>
                        </template>
                    </div>
                </div>

                <template lwc:if={hasReferredBy}>
                    <div class="section">
                        <div
                            class="section-header"
                            data-section="referredBy"
                            onclick={toggleSection}
                        >
                            <lightning-icon
                                icon-name={referredByChevron}
                                size="xx-small"
                                class="section-chevron"
                            ></lightning-icon>
                            <span class="section-label">{referredByLabel}</span>
                        </div>
                        <template lwc:if={referredByExpanded}>
                            <div class="section-body friends-body">
                                <template
                                    for:each={referrerGroups}
                                    for:item="g"
                                >
                                    <div key={g.program} class="program-group">
                                        <span
                                            class="program-pill"
                                            style={g.programStyle}
                                            >{g.program}</span
                                        >
                                        <template
                                            for:each={g.referrers}
                                            for:item="r"
                                        >
                                            <div
                                                key={r.key}
                                                class="referred-by-row"
                                            >
                                                <template lwc:if={r.isLinked}>
                                                    <a
                                                        href={r.sfdcUrl}
                                                        class="record-link"
                                                        >{r.displayName}</a
                                                    >
                                                </template>
                                                <template lwc:else>
                                                    <span class="plain-email"
                                                        >{r.displayName}</span
                                                    >
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template lwc:if={referrersExpandable}>
                                    <div class="show-more-row">
                                        <span class="show-more-count"
                                            >{referrersCountText}</span
                                        >
                                        <template
                                            lwc:if={referrersShowMoreVisible}
                                        >
                                            <lightning-button
                                                variant="neutral"
                                                label="Show more"
                                                onclick={handleShowMoreReferrers}
                                                disabled={isLoadingMoreReferrers}
                                            ></lightning-button>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <template lwc:if={hasShareLinks}>
                    <div class="section">
                        <div
                            class="section-header"
                            data-section="shareLinks"
                            onclick={toggleSection}
                        >
                            <lightning-icon
                                icon-name={shareLinksChevron}
                                size="xx-small"
                                class="section-chevron"
                            ></lightning-icon>
                            <span class="section-label">{shareLinksLabel}</span>
                        </div>
                        <template lwc:if={shareLinksExpanded}>
                            <div class="section-body">
                                <template
                                    for:each={decoratedShareLinks}
                                    for:item="sl"
                                >
                                    <div key={sl.code} class="share-link-row">
                                        <template lwc:if={sl.program}>
                                            <span
                                                class="program-pill"
                                                style={sl.programStyle}
                                                >{sl.program}</span
                                            >
                                        </template>
                                        <template lwc:else>
                                            <span></span>
                                        </template>
                                        <span class="share-link-url">
                                            {sl.link}
                                            <template
                                                lwc:if={sl.isSavedOnRecord}
                                            >
                                                <span
                                                    class="saved-marker"
                                                    title="This link is saved on the record"
                                                    >saved on record</span
                                                >
                                            </template>
                                        </span>
                                        <button
                                            class="copy-btn"
                                            data-link={sl.link}
                                            onclick={handleCopyLink}
                                            title="Copy link"
                                        >
                                            <lightning-icon
                                                icon-name="utility:copy"
                                                size="x-small"
                                            ></lightning-icon>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <template lwc:if={hasFriends}>
                    <div class="section">
                        <div
                            class="section-header"
                            data-section="friends"
                            onclick={toggleSection}
                        >
                            <lightning-icon
                                icon-name={friendsChevron}
                                size="xx-small"
                                class="section-chevron"
                            ></lightning-icon>
                            <span class="section-label">{friendsLabel}</span>
                            <template lwc:if={friendsExpandable}>
                                <button
                                    type="button"
                                    class="expand-btn"
                                    onclick={handleExpand}
                                    title="Expand friends"
                                    aria-label="Expand friends"
                                >
                                    <lightning-icon
                                        icon-name="utility:expand_alt"
                                        size="xx-small"
                                        class="expand-icon"
                                    ></lightning-icon>
                                </button>
                            </template>
                        </div>
                        <template lwc:if={friendsExpanded}>
                            <div class="section-body friends-body">
                                <template for:each={programGroups} for:item="g">
                                    <div key={g.program} class="program-group">
                                        <span
                                            class="program-pill"
                                            style={g.programStyle}
                                            >{g.program}</span
                                        >
                                        <template
                                            for:each={g.friends}
                                            for:item="f"
                                        >
                                            <c-extole-friend-card
                                                key={f.key}
                                                friend={f}
                                            ></c-extole-friend-card>
                                        </template>
                                    </div>
                                </template>
                                <template lwc:if={friendsExpandable}>
                                    <div class="show-more-row">
                                        <span class="show-more-count"
                                            >{friendsCountText}</span
                                        >
                                        <template
                                            lwc:if={friendsShowMoreVisible}
                                        >
                                            <lightning-button
                                                variant="neutral"
                                                label="Show more"
                                                onclick={handleShowMore}
                                                disabled={isLoadingMore}
                                            ></lightning-button>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </template>

        <template lwc:if={loadError}>
            <div class="error-banner">{loadError}</div>
        </template>
    </template>
</template>
