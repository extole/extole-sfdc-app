<template>
    <div class="engagement-card">
        <div class="engagement-header">
            <div class={friend.avatarClass}>
                <template lwc:if={friend.avatarIsEarned}>
                    <lightning-icon
                        icon-name="utility:check"
                        size="x-small"
                        variant="inverse"
                    ></lightning-icon>
                </template>
                <template lwc:elseif={friend.avatarIsDeclined}>
                    <lightning-icon
                        icon-name="utility:close"
                        size="x-small"
                        variant="inverse"
                    ></lightning-icon>
                </template>
                <template lwc:else>
                    <span class="avatar-initials">{friend.avatarInitials}</span>
                </template>
            </div>
            <div class="engagement-identity">
                <template lwc:if={friend.isLinked}>
                    <a href={friend.sfdcUrl} class="engagement-name record-link"
                        >{friend.displayName}</a
                    >
                </template>
                <template lwc:else>
                    <span class="engagement-name">{friend.displayName}</span>
                </template>
            </div>
            <div class="engagement-reward">
                <template lwc:if={friend.rewardStateText}>
                    <span class={friend.rewardStateClass}
                        >{friend.rewardStateText}<template
                            lwc:if={friend.rewardDateText}
                            ><span class="pill-date"
                                >{friend.rewardDateText}</span
                            ></template
                        ></span
                    >
                </template>
            </div>
        </div>
        <template lwc:if={friend.hasMilestones}>
            <div class="milestone-list">
                <template for:each={friend.milestones} for:item="m">
                    <div key={m.key} class={m.rowClass}>
                        <div class="milestone-bullet"></div>
                        <span class="milestone-label">{m.label}</span>
                        <template lwc:if={m.date}>
                            <span class="milestone-date">{m.date}</span>
                        </template>
                        <template lwc:else>
                            <span></span>
                        </template>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
